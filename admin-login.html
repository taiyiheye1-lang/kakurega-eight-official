<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070605">
  <meta name="robots" content="noindex,nofollow">
  <title>管理者ログイン | 隠れ家えいと</title>
  <link rel="stylesheet" href="assets/css/admin.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-config.js" defer></script>
  <script src="assets/js/admin-auth.js" defer></script>
</head>
<body class="admin-login-page">
  <main class="login-shell">
    <section class="login-card">
      <a class="admin-brand" href="index.html">
        <span class="admin-brand__seal">8</span>
        <span><strong>隠れ家えいと</strong><small>ADMIN CONSOLE</small></span>
      </a>

      <div class="login-copy">
        <p class="admin-eyebrow">SECURE LOGIN</p>
        <h1>管理者ログイン</h1>
        <p>価格・おすすめ・売り切れ・店舗情報を管理します。</p>
      </div>

      <div id="config-warning" class="admin-alert admin-alert--warning" hidden>
        Supabaseの接続設定がまだ完了していません。<br>
        <code>assets/js/supabase-config.js</code>を設定してください。
      </div>

      <form id="login-form" class="admin-form" novalidate>
        <label>
          <span>メールアドレス</span>
          <input id="login-email" type="email" autocomplete="username" required placeholder="admin@example.com">
        </label>

        <label>
          <span>パスワード</span>
          <div class="password-field">
            <input id="login-password" type="password" autocomplete="current-password" required placeholder="パスワード">
            <button id="toggle-password" type="button" aria-label="パスワード表示を切り替える">表示</button>
          </div>
        </label>

        <button id="login-button" class="admin-primary-button" type="submit">
          <span>ログイン</span>
        </button>

        <p id="login-message" class="form-message" role="status" aria-live="polite"></p>
      </form>

      <div class="login-notes">
        <p>管理者として登録済みのアカウントだけが利用できます。</p>
        <a href="index.html">← 公開サイトへ戻る</a>
      </div>
    </section>
  </main>
</body>
</html>
